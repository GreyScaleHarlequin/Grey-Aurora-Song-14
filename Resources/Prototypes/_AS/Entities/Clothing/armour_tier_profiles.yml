    tags:
    - ArmourNonVacCivilwearTierTwo

- type: entity
  abstract: true
  id: ASArmourNonVacCivilWearT3 # that cool leather jacket you saw in that one store, you remember it, yeah you do.
  suffix: T3 Non Vac Civilian
